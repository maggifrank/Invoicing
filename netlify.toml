[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[dev]
  port         = 8889
  functionsPort = 9999

# Redirect all paths to index.html for client-side routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# send-staging and send-invoices declare their own schedule in code via
# @netlify/functions' schedule() wrapper, which also makes them
# unreachable via direct HTTP request (see ntl.fyi/sched-func).
