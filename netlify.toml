[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[dev]
  port         = 8889
  functionsPort = 9999

# Redirect all paths to index.html for client-side routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[[scheduled_functions]]
  name     = "send-staging"
  schedule = "0 11 22 * *"

[[scheduled_functions]]
  name     = "send-invoices"
  schedule = "0 9 25 * *"
