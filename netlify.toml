[build]
  publish = "."

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[dev]
  port         = 8889
  functionsPort = 9999

# Redirect all paths to index.html for client-side routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# send-staging and send-invoices are plain HTTP functions triggered by a
# pg_cron job in Supabase (see supabase/migrations), not by Netlify's own
# scheduler — that was found to still accept direct HTTP requests even
# when declared as a scheduled function. Each request must carry a shared
# secret (SCHEDULED_FUNCTIONS_SECRET) that only the cron job knows.
